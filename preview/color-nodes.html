<!-- @dsCard group="Colors" name="Chart colours" subtitle="Neutral with one focus; the red ramp for a family" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--paper);color:var(--fg1);font-family:var(--font-sans);}
  .p{padding:20px 24px;display:grid;gap:18px;font-size:13px;color:var(--fg2);}
  b{color:var(--fg1);}
  .b{display:flex;align-items:flex-end;gap:8px;height:80px;margin-top:8px;}
  .b i{width:42px;border-radius:5px 5px 0 0;display:block;}
</style>
</head>
<body><div class="p">
<div><b>One series:</b> neutral, with the focus in red
  <div class="b"><i style="height:45%;background:var(--chart-neutral)"></i><i style="height:60%;background:var(--chart-neutral)"></i><i style="height:72%;background:var(--chart-neutral)"></i><i style="height:100%;background:var(--chart-1)"></i></div></div>
<div><b>One family:</b> the red ramp
  <div class="b"><i style="height:100%;background:var(--ramp-1)"></i><i style="height:82%;background:var(--ramp-2)"></i><i style="height:66%;background:var(--ramp-3)"></i><i style="height:50%;background:var(--ramp-4)"></i><i style="height:36%;background:var(--ramp-5)"></i></div></div>
</div></body>
</html>
